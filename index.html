<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prem R Gautam | Introduction</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #e6f1ff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 40px;
      width: 90%;
      max-width: 900px;
      display: flex;
      align-items: center;
      gap: 40px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .profile-img {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .profile-img img {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.2);
    }

    .content {
      flex: 2;
    }

    .content h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .content h2 {
      font-size: 1.2rem;
      font-weight: 300;
      margin-bottom: 20px;
      color: #b0c4de;
    }

    .content p {
      line-height: 1.6;
      color: #dbe9ff;
    }

    .highlight {
      color: #66ccff;
      font-weight: 500;
    }

    @media(max-width: 768px) {
      .container {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="profile-img">
      <!-- Replace with your image -->
      <img src="your-image.jpg" alt="Prem R Gautam">
    </div>

    <div class="content">
      <h1>Prem R Gautam</h1>
      <h2>B.Tech CSE (AI & ML) Student | MIT VPU University</h2>
      <p>
        Hello! I'm a <span class="highlight">1st year engineering student</span> passionate about
        <span class="highlight">Artificial Intelligence</span> and <span class="highlight">Machine Learning</span>.
        
        Alongside academics, I work as a <span class="highlight">freelance graphic designer</span>
        and continuously explore the world of <span class="highlight">coding and development</span>.
      </p>
    </div>
  </div>

</body>
</html>
